name: Build A001D Kernel (3.18)

on:
  workflow_dispatch:
  push:
    branches: [ 11 ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: Leod3c11/kernel_asus_A001D
          ref: 11
          path: kernel
          fetch-depth: 1

      - name: Instalar dependências de build
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libncurses-dev \
            git curl python2 zip lib32z1 lib32ncurses6 \
            lib32stdc++6 u-boot-tools
          sudo update-alternatives --install /usr/bin/python python /usr/bin/python2 1

      - name: Clonar toolchain GCC 4.9 (aarch64-linux-android)
        run: |
          git clone --depth=1 -b android-9.0.0_r1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 toolchain-64

      - name: Clonar toolchain GCC 4.9 (arm-linux-androideabi, p/ módulos/thumb)
        run: |
          git clone --depth=1 -b android-9.0.0_r1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 toolchain-32

      - name: Verificar se os compiladores existem
        run: |
          test -x toolchain-64/bin/aarch64-linux-android-gcc || (echo "GCC 64-bit não encontrado!" && exit 1)
          test -x toolchain-32/bin/arm-linux-androideabi-gcc || (echo "GCC 32-bit não encontrado!" && exit 1)
          toolchain-64/bin/aarch64-linux-android-gcc --version

      - name: Exportar variáveis de ambiente
        run: |
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "SUBARCH=arm64" >> $GITHUB_ENV
          echo "CROSS_COMPILE=$GITHUB_WORKSPACE/toolchain-64/bin/aarch64-linux-android-" >> $GITHUB_ENV
          echo "CROSS_COMPILE_ARM32=$GITHUB_WORKSPACE/toolchain-32/bin/arm-linux-androideabi-" >> $GITHUB_ENV
          echo "KBUILD_BUILD_USER=Leonardo" >> $GITHUB_ENV
          echo "KBUILD_BUILD_HOST=github-actions" >> $GITHUB_ENV

      - name: Gerar .config a partir do defconfig
        working-directory: kernel
        run: |
          make O=out ARCH=arm64 A001D_defconfig

      - name: Compilar kernel
        working-directory: kernel
        run: |
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CROSS_COMPILE=$CROSS_COMPILE \
            CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32 \
            2>&1 | tee build.log

      - name: Conferir se a Image foi gerada
        working-directory: kernel
        run: |
          ls -la out/arch/arm64/boot/ || (echo "Build falhou, veja build.log" && exit 1)

      - name: Upload do log de build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: kernel/build.log

      - name: Upload da Image compilada
        uses: actions/upload-artifact@v4
        with:
          name: kernel-A001D-output
          path: |
            kernel/out/arch/arm64/boot/Image*
            kernel/out/arch/arm64/boot/dts/**/*.dtb
            kernel/out/.config

      - name: Clonar template do AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3

      - name: Configurar anykernel.sh com offsets oficiais do A001D
        run: |
          cat > ak3/anykernel.sh << 'EOF'
          ### AnyKernel3 Ramdisk Mod Script
          ## osm0sis @ xda-developers

          properties() { '
          kernel.string=A001D Custom Kernel 3.18 by Leonardo
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=A001D
          device.name2=ASUS_A001D
          device.name3=ASUS_A001D_2
          supported.versions=
          supported.patchlevels=
          '; } # end properties

          ### AnyKernel methods (DO NOT CHANGE)
          . tools/ak3-core.sh

          ## boot shell variables
          block=/dev/block/bootdevice/by-name/boot;
          is_slot_device=0;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;

          ## AnyKernel install
          dump_boot;

          # parâmetros oficiais vindos do BoardConfig.mk do GuilianoS/device_asus_A001D
          BASE=0x80000000;
          PAGESIZE=2048;
          RAMDISK_OFFSET=0x01000000;
          TAGS_OFFSET=0x00000100;
          CMDLINE="console=ttyHSL0,115200,n8 androidboot.console=ttyHSL0 androidboot.hardware=qcom msm_rtb.filter=0x237 ehci-hcd.park=3 lpm_levels.sleep_disabled=1 androidboot.bootdevice=7824900.sdhci earlycon=msm_hsl_uart,0x78af000 firmware_class.path=/vendor/firmware_mnt/image loop.max_part=7 androidboot.usbconfigfs=false androidboot.selinux androidboot.selinux=permissive";

          write_boot;
          ## end install
          EOF

      - name: Copiar Image.gz-dtb compilada para o AnyKernel3
        run: |
          cp kernel/out/arch/arm64/boot/Image.gz-dtb ak3/Image.gz-dtb

      - name: Gerar zip flashável
        working-directory: ak3
        run: |
          rm -rf .git
          zip -r9 ../A001D-kernel-$(date +%Y%m%d-%H%M).zip . -x ".git*"

      - name: Upload do zip flashável (AnyKernel3)
        uses: actions/upload-artifact@v4
        with:
          name: A001D-kernel-flashable-zip
          path: A001D-kernel-*.zip
